name: CI

# Runs on the self-hosted runner (label "speklo"; rename the label on GitHub to change it), in dependency order:
#
#   Secret scan
#    └─ Dependency vulnerabilities
#        ├─ Server API (Go) ──┐
#        ├─ Server web UI ────┴─ Docker image (one image: Go serves the API and the UI)
#        ├─ Desktop (macOS)
#        └─ Helm chart (GitHub-hosted Linux: lint, then install into a kind cluster)
#
# A leaked secret or a vulnerable dependency stops everything; an image is
# only built from code whose checks passed. Jobs from pull requests
# opened from forks are skipped, so outside code never runs on that machine.
# (Fork PR workflows are also disabled in the repository's Actions settings.)
#
# The runner is one machine that keeps its disk between runs, so whatever is
# downloaded or built is cached on it: Go modules and build cache, npm
# packages, the Docker builder's layers, the desktop build. GitHub's cache is
# not used; every job would have to download it and upload it again.
#
# Each job keeps the Mac awake while it runs (GitHub fails a job whose runner
# sleeps) and has a time limit, so a hung job can't hold the only runner.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    steps:
      - name: Keep the Mac awake during this job
        run: caffeinate -i -t 3600 >/dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks (settings in .gitleaks.toml)
        run: |
          # Kept in the runner's tool folder, so it is downloaded once per version.
          version=8.30.1
          dir="$RUNNER_TOOL_CACHE/gitleaks/$version"
          if [ ! -x "$dir/gitleaks" ]; then
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64) asset=darwin_arm64 ;; Darwin-x86_64) asset=darwin_x64 ;;
              Linux-aarch64) asset=linux_arm64 ;; *) asset=linux_x64 ;;
            esac
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_${asset}.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
            mkdir -p "$dir"
            mv "$RUNNER_TEMP/gitleaks" "$dir/gitleaks"
          fi
          "$dir/gitleaks" git --redact -v

  vulnerabilities:
    name: Dependency vulnerabilities
    timeout-minutes: 15
    needs: secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    steps:
      - name: Keep the Mac awake during this job
        run: caffeinate -i -t 3600 >/dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/api/go.mod
          cache: false # modules and the build cache are already on the runner's disk
      - name: Go (govulncheck)
        working-directory: server/api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Web (npm audit)
        working-directory: server/web
        run: npm audit --audit-level=moderate
      - name: Desktop (cargo audit)
        working-directory: desktop
        run: |
          # Tools CI installs go in the runner's own folder, never the machine's ~/.cargo.
          tools="$RUNNER_TOOL_CACHE/cargo-tools"; export PATH="$tools/bin:$PATH"
          command -v cargo-audit >/dev/null || cargo install --locked --root "$tools" cargo-audit
          cargo audit

  api:
    name: Server API (Go)
    timeout-minutes: 20
    needs: vulnerabilities
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    defaults: { run: { working-directory: server/api } }
    steps:
      - name: Keep the Mac awake during this job
        run: caffeinate -i -t 3600 >/dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/api/go.mod
          cache: false # modules and the build cache are already on the runner's disk
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Server web UI (React)
    timeout-minutes: 15
    needs: vulnerabilities
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    defaults: { run: { working-directory: server/web } }
    steps:
      - name: Keep the Mac awake during this job
        run: caffeinate -i -t 3600 >/dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # no cache input: npm's download cache is already on the runner's disk
      - run: npm ci --no-audit --no-fund
      - run: npm run build # type-checks, then bundles

  image:
    name: Docker image
    timeout-minutes: 30
    needs: [api, web]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    steps:
      - name: Keep the Mac awake during this job
        run: caffeinate -i -t 3600 >/dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # One builder that stays on the runner. Its layers and the Dockerfile's
      # cache mounts (npm packages, Go modules, compiled Go packages) survive
      # between runs, so a build only fetches and compiles what changed.
      # "use: false" leaves the machine's own default builder alone.
      # To start clean: docker buildx rm requara-ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The config below is applied only when the builder is created, so
          # rename the builder whenever the config changes.
          name: requara-ci
          use: false
          cleanup: false
          # BuildKit drops the oldest cache beyond 10 GB. No free-space
          # target: the Docker VM is shared, and a target above its free
          # space makes BuildKit delete the whole cache after every build.
          buildkitd-config-inline: |
            [worker.oci]
              gc = true
              maxUsedSpace = "10GB"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: requara-ci
          context: server
          push: false

  # The rules for main still require the two image checks from before the
  # server became one image. These report them from the single build and fail
  # unless it succeeded. Remove them once the rule requires "Docker image".
  image-required:
    name: Docker image (${{ matrix.part }})
    timeout-minutes: 5
    needs: image
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, speklo]
    strategy:
      matrix:
        part: [api, web]
    steps:
      - name: The image build succeeded
        run: |
          [ "${{ needs.image.result }}" = success ] || { echo "Docker image job: ${{ needs.image.result }}"; exit 1; }

  # The Helm chart, installed for real: build the image from this commit, start
  # a kind cluster, install the chart with its bundled Postgres, OpenBao and
  # S3, and check the server answers. Runs on a GitHub-hosted Linux machine
  # (Kubernetes in Docker needs Linux), in parallel with the jobs on the Mac.
  helm:
    name: Helm chart
    timeout-minutes: 30
    needs: vulnerabilities
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint
        run: |
          helm lint server/deploy/helm/requara
          helm lint server/deploy/helm/requara -f server/deploy/helm/requara/ci/kind-values.yaml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image from this commit
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          load: true
          tags: requara:ci
          cache-from: type=gha,scope=helm-ci
          cache-to: type=gha,mode=max,scope=helm-ci
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: requara
      - name: Install the chart
        run: |
          kind load docker-image requara:ci --name requara
          kubectl create namespace requara
          # Email sign-in needs an SMTP server: Mailpit, like in development.
          kubectl -n requara create deployment mailpit --image=axllent/mailpit:v1.27 --port=1025
          kubectl -n requara expose deployment mailpit --port=1025
          helm install requara server/deploy/helm/requara -n requara \
            -f server/deploy/helm/requara/ci/kind-values.yaml \
            --set image.repository=requara --set image.tag=ci --set image.pullPolicy=Never \
            --wait --timeout 10m
      - name: The server answers
        run: |
          kubectl -n requara port-forward svc/requara 8080:80 > /tmp/port-forward.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/healthz >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8080/api/version | tee /tmp/version.json
          grep -q '"name":"requara"' /tmp/version.json
          curl -sf -o /dev/null http://localhost:8080/
          curl -sf http://localhost:8080/auth/providers | grep -q '"id":"email"'
      - name: OpenBao unseals itself after a restart
        run: |
          kubectl -n requara delete pod requara-openbao-0 --wait=true
          kubectl -n requara wait --for=condition=Ready pod/requara-openbao-0 --timeout=180s
          kubectl -n requara rollout restart deployment/requara
          kubectl -n requara rollout status deployment/requara --timeout=180s
      - name: What went wrong
        if: failure()
        run: |
          kubectl -n requara get pods -o wide || true
          kubectl -n requara describe pods | tail -n 80 || true
          for p in $(kubectl -n requara get pods -o name); do echo "== $p"; kubectl -n requara logs "$p" --tail=40 || true; done

  # The runner is a Mac, so CI builds the macOS desktop app. Windows and Linux
  # installers are built at release time (release.yml).
  desktop:
    name: Desktop (macOS)
    timeout-minutes: 30
    needs: vulnerabilities
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    defaults: { run: { working-directory: desktop } }
    steps:
      - name: Keep the Mac awake during this job
        run: caffeinate -i -t 3600 >/dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Cargo's build folder lives in the runner's tool folder: checkout empties the
      # workspace (target/ included) before every job, and from there only what
      # changed is recompiled.
      # No rust-cache: on a self-hosted runner its cleanup deletes the machine's own
      # programs from ~/.cargo/bin.
      # Uses the runner's installed Rust (rustup); no toolchain changes on the machine.
      - name: Keep the build folder between runs
        run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/requara-desktop-target" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
