name: PR title

# Release-please reads the squash-merge commit, which is the PR title, to
# decide what to release: fix → patch, feat → minor, feat! → major.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    # Checks only the title (no code is checked out), on the self-hosted runner;
    # skipped for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, speklo]
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
