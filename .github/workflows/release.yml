name: Release

# Runs on the self-hosted runner (label "speklo"), except the desktop
# installers a Mac can't build (Intel Mac, Windows, Linux), which use
# GitHub-hosted runners.
#
# Every push to main runs release-please. It keeps a release PR open per
# product (server, desktop). Merging one creates that product's tag and
# GitHub Release, and the jobs below build and attach what it ships:
#
#   server-vX.Y.Z  → ghcr.io/<owner>/<repo>/api and /web images (same tag)
#                    + speklo-selfhost-X.Y.Z.tar.gz (compose bundle) on the Release
#   desktop-vX.Y.Z → installers for macOS, Windows and Linux on the Release
on:
  push:
    branches: [main]

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: [self-hosted, speklo]
    permissions:
      contents: write
      pull-requests: write
    outputs:
      server: ${{ steps.rp.outputs['server--release_created'] }}
      server_tag: ${{ steps.rp.outputs['server--tag_name'] }}
      server_version: ${{ steps.rp.outputs['server--version'] }}
      desktop: ${{ steps.rp.outputs['desktop--release_created'] }}
      desktop_tag: ${{ steps.rp.outputs['desktop--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------- server: two images, one version ----------
  server-images:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    runs-on: [self-hosted, speklo]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.release-please.outputs.server_tag }}" }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Speklo ${{ matrix.image }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.server_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  server-bundle:
    needs: [release-please, server-images]
    runs-on: [self-hosted, speklo]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.release-please.outputs.server_tag }}" }
      - name: Pin the images and version in the bundle
        env:
          VERSION: ${{ needs.release-please.outputs.server_version }}
        run: |
          prefix="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          out="$RUNNER_TEMP/bundle" && rm -rf "$out" && mkdir -p "$out"
          cp -R server/deploy "$out/speklo"
          perl -pi -e "s#ghcr.io/OWNER/REPO#${prefix}#g" "$out/speklo/docker-compose.yml"
          perl -pi -e "s#^SPEKLO_VERSION=.*#SPEKLO_VERSION=${VERSION}#" "$out/speklo/.env.example"
          tar czf "server/speklo-selfhost-${VERSION}.tar.gz" -C "$out" speklo
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.server_tag }}" server/speklo-selfhost-*.tar.gz --clobber

  # ---------- desktop: installers on the release ----------
  desktop:
    needs: release-please
    if: needs.release-please.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: '["self-hosted","speklo"]', self_hosted: true, name: macOS (Apple silicon) }
          - { runner: '"macos-15-intel"', self_hosted: false, name: macOS (Intel) }
          - { runner: '"windows-latest"', self_hosted: false, name: Windows }
          - { runner: '"ubuntu-22.04"', self_hosted: false, name: Linux }
    name: Desktop · ${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: write
    defaults: { run: { working-directory: desktop, shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ needs.release-please.outputs.desktop_tag }}" }
      # The self-hosted runner uses its installed Rust; no toolchain changes there.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: ${{ !matrix.self_hosted }}
        with: { toolchain: stable }
      # Only on GitHub-hosted runners: on the self-hosted Mac its cleanup deletes
      # the machine's own programs from ~/.cargo/bin.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !matrix.self_hosted }}
        with: { workspaces: desktop }
      - name: Linux libraries for GPUI and the keychain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libdbus-1-dev
      - name: cargo-packager (into the runner's folder, never the machine's ~/.cargo)
        run: |
          tools="$RUNNER_TOOL_CACHE/cargo-tools"
          echo "$tools/bin" >> "$GITHUB_PATH"
          PATH="$tools/bin:$PATH" command -v cargo-packager >/dev/null || cargo install --locked --root "$tools" cargo-packager
      # Code signing: add the Apple Developer ID / Windows signing secrets and
      # the matching cargo-packager settings before shipping to customers.
      # Unsigned builds work but show "unidentified developer" warnings.
      - run: cargo packager --release
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.desktop_tag }}" target/packages/* --clobber
