# Kept quiet on purpose: one grouped PR per ecosystem, once a month, minor and
# patch updates only. Major upgrades (e.g. antd 5 → 6) are done by hand.
# Security fixes don't wait for the schedule: they arrive as Dependabot alerts
# and security-update PRs as soon as they're published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server/api
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { go: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]

  - package-ecosystem: npm
    directory: /server/web
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { web: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]

  - package-ecosystem: cargo
    directory: /desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { desktop: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]

  - package-ecosystem: docker
    directories: [/server/api, /server/web]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { images: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { actions: { patterns: ["*"] } }
    ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
