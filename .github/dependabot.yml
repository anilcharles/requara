# Weekly dependency updates; security fixes arrive as soon as they're published.
version: 2
updates:
  - { package-ecosystem: gomod, directory: /server/api, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /server/web, schedule: { interval: weekly } }
  - { package-ecosystem: cargo, directory: /desktop, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /server/api, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /server/web, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
