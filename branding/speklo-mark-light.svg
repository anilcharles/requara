<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 9 46 46" width="512" height="512" role="img" aria-label="Speklo">
  <!-- No background: the gap around the speck is cut out of the ring with a mask. -->
  <defs>
    <mask id="speck-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <circle cx="44.7" cy="19.3" r="9" fill="black"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#14161F" stroke-width="5" mask="url(#speck-gap)"/>
  <circle cx="44.7" cy="19.3" r="5.5" fill="#4F46E5"/>
</svg>
