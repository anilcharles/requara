openapi: 3.0.3
info:
  title: Payments API
  version: 2.4.0
  description: Charges, refunds, payouts and disputes.
servers:
  - url: https://api.acme.dev
tags:
  - name: Charges
  - name: Refunds
  - name: Customers
paths:
  /v2/charges:
    post:
      tags: [Charges]
      operationId: createCharge
      summary: Create a charge
      description: Creates a charge against a customer's default payment method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCreate'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
              example:
                id: ch_3PqL9bK2eZvKYlo2
                object: charge
                amount: 4200
                amount_captured: 4200
                captured: true
                currency: usd
                customer: cus_Qw81nTz4
                status: succeeded
                created: 1794590112
                livemode: true
        '400':
          $ref: '#/components/responses/Problem'
    get:
      tags: [Charges]
      operationId: listCharges
      summary: List charges
      description: Returns charges, newest first.
      parameters:
        - name: limit
          in: query
          description: How many charges to return, 1 to 100.
          schema: { type: integer, example: 25 }
        - name: customer
          in: query
          description: Only charges for this customer.
          schema: { type: string }
      responses:
        '200':
          description: A page of charges
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Charge' }
                  has_more: { type: boolean, example: false }
  /v2/charges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The charge ID.
        schema: { type: string, example: ch_3PqL9bK2eZvKYlo2 }
    get:
      tags: [Charges]
      operationId: retrieveCharge
      summary: Retrieve a charge
      description: Returns a charge by ID.
      responses:
        '200':
          description: The charge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Charges]
      operationId: voidCharge
      summary: Void a charge
      description: Releases an uncaptured charge. Captured charges must be refunded instead.
      responses:
        '200':
          description: The voided charge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
        '409':
          $ref: '#/components/responses/Problem'
  /v2/charges/{id}/capture:
    parameters:
      - name: id
        in: path
        required: true
        description: The charge ID.
        schema: { type: string, example: ch_3PqL9bK2eZvKYlo2 }
    post:
      tags: [Charges]
      operationId: captureCharge
      summary: Capture a charge
      description: Captures an authorized charge. Uncaptured charges expire after 7 days.
      responses:
        '200':
          description: The captured charge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
  /v2/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Create a refund
      description: Refunds all or part of a captured charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charge]
              x-order: [charge, amount, reason]
              properties:
                charge: { type: string, description: ID of the charge to refund, example: ch_3PqL9bK2eZvKYlo2 }
                amount: { type: integer, description: Amount in cents. Defaults to the full amount., example: 1500 }
                reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer], description: Why the refund was made }
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List refunds
      description: Returns refunds, newest first.
      responses:
        '200':
          description: A page of refunds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
  /v2/refunds/{id}:
    get:
      tags: [Refunds]
      operationId: retrieveRefund
      summary: Retrieve a refund
      description: Returns a refund by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The refund ID.
          schema: { type: string, example: re_1Lk9a2 }
      responses:
        '200':
          description: The refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
  /v2/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: Creates a customer you can charge later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              x-order: [email, name]
              properties:
                email: { type: string, format: email, description: Where receipts are sent, example: jo@example.com }
                name: { type: string, description: Full name, example: Jo Park }
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
  /v2/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The customer ID.
        schema: { type: string, example: cus_Qw81nTz4 }
    get:
      tags: [Customers]
      operationId: retrieveCustomer
      summary: Retrieve a customer
      description: Returns a customer by ID.
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      description: Updates a customer's details.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-order: [email, name]
              properties:
                email: { type: string, format: email, description: Where receipts are sent }
                name: { type: string, description: Full name }
      responses:
        '200':
          description: The updated customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
components:
  schemas:
    ChargeCreate:
      type: object
      required: [amount, currency, customer]
      x-order: [amount, currency, customer, description, metadata]
      properties:
        amount:
          type: integer
          description: In cents, e.g. 4200 = $42.00
          example: 4200
        currency:
          type: string
          enum: [usd, eur, gbp]
          description: Three-letter ISO code. One of usd, eur, gbp
          example: usd
        customer:
          type: string
          description: ID of the customer to charge
          example: cus_Qw81nTz4
        description:
          type: string
          description: Shown on receipts and in the dashboard
          example: Order 1042, annual plan
        metadata:
          type: object
          description: Up to 50 key-value pairs
          x-order: [order_id, channel]
          properties:
            order_id: { type: string, description: Your internal order reference, example: ord_8Kx2Lm }
            channel: { type: string, enum: [web, ios, android], description: "web, ios or android", example: web }
    Charge:
      type: object
      x-order: [id, object, amount, amount_captured, captured, currency, customer, status, created, livemode]
      properties:
        id: { type: string, example: ch_3PqL9bK2eZvKYlo2 }
        object: { type: string, example: charge }
        amount: { type: integer, example: 4200 }
        amount_captured: { type: integer, example: 0 }
        captured: { type: boolean, example: false }
        currency: { type: string, example: usd }
        customer: { type: string, example: cus_Qw81nTz4 }
        status: { type: string, enum: [requires_capture, succeeded, voided], example: requires_capture }
        created: { type: integer, example: 1794590112 }
        livemode: { type: boolean, example: true }
    Refund:
      type: object
      x-order: [id, object, amount, charge, status]
      properties:
        id: { type: string, example: re_1Lk9a2 }
        object: { type: string, example: refund }
        amount: { type: integer, example: 1500 }
        charge: { type: string, example: ch_3PqL9bK2eZvKYlo2 }
        status: { type: string, example: succeeded }
    Customer:
      type: object
      x-order: [id, object, email, name]
      properties:
        id: { type: string, example: cus_Qw81nTz4 }
        object: { type: string, example: customer }
        email: { type: string, example: jo@example.com }
        name: { type: string, example: Jo Park }
    Problem:
      type: object
      x-order: [type, title, status, detail]
      properties:
        type: { type: string, example: https://docs.acme.dev/errors/invalid-request }
        title: { type: string, example: Invalid request }
        status: { type: integer, example: 400 }
        detail: { type: string, example: amount must be a positive integer }
  responses:
    Problem:
      description: Problem details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
