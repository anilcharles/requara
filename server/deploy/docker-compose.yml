# Requara, self-hosted. People sign in with the providers you enable in .env
# (Google, Microsoft, GitHub, GitLab, Okta, Auth0, Keycloak, any OIDC or SAML
# provider, or one-time email links).
#
#   cp .env.example .env      # then edit it
#   echo you@your-company.com >> admins.txt   # instance admins (a Docker secret)
#   docker compose up -d
#
# Register Requara with each sign-in provider first (see README.md), then
# open REQUARA_URL and sign in.
# Upgrade: change REQUARA_VERSION in .env, then `docker compose pull && docker compose up -d`.
name: requara

services:
  # The Requara server: one Go program serving the web UI, the API, sign-in
  # and mock servers on one address.
  requara:
    image: ${REQUARA_IMAGE_PREFIX:-ghcr.io/OWNER/REPO}/server:${REQUARA_VERSION:-latest}
    restart: unless-stopped
    ports: ["${REQUARA_PORT:-8080}:8080"]
    # Sign-in providers (REQUARA_AUTH_*) and access settings come from .env,
    # so you can add providers without editing this file.
    env_file: .env
    environment:
      REQUARA_ENV: prod
      REQUARA_FRONTEND_URL: ${REQUARA_URL:-http://localhost:8080}
      REQUARA_PUBLIC_URL: ${REQUARA_URL:-http://localhost:8080}
      REQUARA_ORG_NAME: ${REQUARA_ORG_NAME:-Requara}
      REQUARA_AUTH_PROVIDERS: ${REQUARA_AUTH_PROVIDERS:?set REQUARA_AUTH_PROVIDERS in .env (e.g. google,github)}
      BAO_ADDR: http://openbao:8200
      BAO_ROLE_ID_FILE: /openbao-creds/role-id
      BAO_SECRET_ID_FILE: /openbao-creds/secret-id
      # Instance admins: emails in admins.txt (mounted as a Docker secret),
      # plus any in REQUARA_ADMIN_EMAILS in .env. Nobody becomes admin from the browser.
      REQUARA_ADMIN_EMAILS_FILE: /run/secrets/requara_admins
    secrets: [requara_admins]
    volumes:
      - "openbao-creds:/openbao-creds:ro"
      # SAML metadata, certificates and signing keys, if you use files for them.
      - "./saml:/etc/requara/saml:ro"
    depends_on:
      postgres: { condition: service_healthy }
      openbao: { condition: service_healthy }
      s3: { condition: service_started }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: requara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: requara
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requara"]
      interval: 3s
      retries: 30

  # Secrets: the backend's own settings, plus Transit encryption for the
  # secrets people store in environments. Starts, unseals and configures
  # itself (openbao/entrypoint.sh).
  openbao:
    image: openbao/openbao:2.4
    restart: unless-stopped
    user: "0"
    entrypoint: ["/bin/sh", "/openbao/config/entrypoint.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-requara}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_FROM: ${SMTP_FROM:-Requara <no-reply@localhost>}
    volumes:
      - "./openbao:/openbao/config:ro"
      - "openbao-data:/openbao/data"
      - "openbao-keys:/openbao/keys"
      - "openbao-creds:/openbao/creds"
    healthcheck:
      test: ["CMD-SHELL", "test -f /openbao/creds/ready"]
      interval: 3s
      retries: 60

  # S3-compatible storage for large response bodies.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"requara","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-requara}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: ["s3data:/data"]

secrets:
  requara_admins:
    file: ${REQUARA_ADMINS_FILE:-./admins.txt}

volumes:
  pgdata: {}
  s3data: {}
  openbao-data: {}
  openbao-keys: {}
  openbao-creds: {}
