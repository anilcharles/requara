{{- $full := include "requara.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-admins
  labels: {{- include "requara.labels" . | nindent 4 }}
type: Opaque
stringData:
  admins: |
    {{- range .Values.admins }}
    {{ . }}
    {{- end }}
{{- if .Values.bundled.enabled }}
{{- $gen := include "requara.generated" . | fromYaml }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-generated
  labels: {{- include "requara.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: losing it would lock the bundled data away.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $gen }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
